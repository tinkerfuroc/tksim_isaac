[project]
name = "map-check"
version = "0.1.0"
description = "Localhost tool to check poses against a measured arena map"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "numpy",
    "scipy",
    "pyyaml",
    "pillow",
    "usd-core",
]

[dependency-groups]
dev = ["pytest", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["map_check"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Starlette prefers httpx2; the dev pin stays on the stable httpx 0.28 line.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
