[project]
name = "map-check"
version = "0.1.0"
description = "Localhost tool to check poses against a measured arena map"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "numpy",
    "scipy",
    "pyyaml",
    "pillow",
    "usd-core",
]

[dependency-groups]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["map_check"]

[tool.pytest.ini_options]
pythonpath = ["."]
