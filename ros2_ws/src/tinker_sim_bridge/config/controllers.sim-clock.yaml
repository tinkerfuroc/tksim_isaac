# Arm profile for the simulated clock -- path-tolerance enforcement OFF.
#
# WHY THIS FILE EXISTS
# Isaac pins physics to the CPU by design. On this host (Xeon E5-2620 v4 @
# 2.10 GHz) the measured real-time factor is 0.0707: 8.5 physics steps per
# wall second against a 120 Hz target, with the GPU idle at 4-5% -- so the
# sim is CPU-bound, not render-bound, and `physics_hz` is a backend
# constructor default with no CLI knob. The tick rate cannot simply be
# raised on this machine.
#
# A MoveIt trajectory is time-parameterised for real-speed execution. Played
# against a clock advancing at ~7% of real time the simulated arm falls
# arbitrarily far behind its desired path -- measured 0.0015 rad of joint1
# travel across 0.8 s of sim time -- and joint_trajectory_controller aborts
# mid-flight with PATH_TOLERANCE_VIOLATED. GPSR then retries forever and
# never reaches its navigation leg.
#
# controllers.yaml already carries 1.0-2.0 rad path tolerances and
# goal_time 60.0 from earlier rounds of this same tracking-lag family, and
# the arm still blows straight through them. Widening them again just moves
# the number; the honest statement is that the *path* is not a meaningful
# contract when the plant runs at 7% speed.
#
# WHAT THIS CHANGES
# Per-joint `trajectory: 0.0` -- in joint_trajectory_controller that means
# "do not enforce" -- so the controller stops policing intermediate
# deviation and lets the arm converge at whatever pace the simulated clock
# allows. The ENDPOINT contract is deliberately untouched: `goal` stays at
# the shipped 0.5 rad and `goal_time` at 60.0 s, so a run that ends in the
# wrong pose, or an arm that is genuinely wedged, still fails.
#
# SCOPE: opt-in only. Select it with
#   ros2 launch tinker_sim_bridge gpsr.launch.py controllers_file:=<abs path>
# Hardware runs must keep the shipped controllers.yaml -- a real arm that
# leaves its planned path is a safety event, not a slow plant.
#
# Generated from controllers.yaml; keep the two in sync when that file
# changes. Path tolerances replaced (joint: shipped -> here):
#   joint1: 1.0 -> 0.0
#   joint2: 1.5 -> 0.0
#   joint3: 2.0 -> 0.0
#   joint4: 2.0 -> 0.0
#   joint5: 1.0 -> 0.0
#   joint6: 1.0 -> 0.0
#   joint7: 1.0 -> 0.0
controller_manager:
  ros__parameters:
    update_rate: 150
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    xarm7_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController
xarm7_traj_controller:
  ros__parameters:
    use_sim_time: true
    command_interfaces:
    - position
    - velocity
    state_interfaces:
    - position
    - velocity
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    constraints:
      goal_time: 60.0
      stopped_velocity_tolerance: 0.0
      joint1:
        trajectory: 0.0
        goal: 0.5
      joint2:
        trajectory: 0.0
        goal: 0.5
      joint3:
        trajectory: 0.0
        goal: 0.5
      joint4:
        trajectory: 0.0
        goal: 0.5
      joint5:
        trajectory: 0.0
        goal: 0.5
      joint6:
        trajectory: 0.0
        goal: 0.5
      joint7:
        trajectory: 0.0
        goal: 0.5
    state_publish_rate: 25.0
    action_monitor_rate: 10.0
