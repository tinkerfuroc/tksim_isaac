name: two_arm_demo
kinematics: diff_drive
base_frame: base_link
wheels:
  driven:
  - front_left_wheel_joint
  - front_right_wheel_joint
  caster_swivel:
  - rear_left_swivel_joint
  - rear_right_swivel_joint
  caster_wheel:
  - rear_left_wheel_joint
  - rear_right_wheel_joint
arms:
- name: left
  mount: left_arm_base
  joints:
  - l_j1
  - l_j2
  - l_j3
  gripper:
    drive: l_grip
    mimics:
    - l_finger
  drive:
    stiffness: 400.0
    damping: 40.0
- name: right
  mount: right_arm_base
  joints:
  - r_j1
  - r_j2
  - r_j3
  gripper: null
  drive:
    stiffness: 400.0
    damping: 40.0
pan_tilt:
  joints:
  - pan_joint
  - tilt_joint
sensors:
- type: livox_mid360
  frame: livox_frame
